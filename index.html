<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Elton — Seguidores</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--green);letter-spacing:.04em}

.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}

.hdr-right{display:flex;align-items:center;gap:8px}
.presets{display:flex;gap:4px}
.btn-pre{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .12s;white-space:nowrap}
.btn-pre:hover{border-color:var(--border-h);color:var(--text)}
.btn-pre.on{background:rgba(59,130,246,.16);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}
.drbox{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s;padding:0 6px;gap:3px}
.drbox:focus-within{border-color:rgba(96,165,250,.5)}
.drbox-icon{color:var(--hint);font-size:12px;user-select:none}
.drbox input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:5px 4px;cursor:pointer;color-scheme:dark;width:100px}
.drbox-sep{color:var(--hint);font-size:11px;user-select:none}
.btn-update{background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.3);color:#60a5fa;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap;box-shadow:0 0 16px rgba(59,130,246,.2)}
.btn-update:hover:not(:disabled){box-shadow:0 0 16px rgba(59,130,246,.4)}
.btn-update:disabled{opacity:.4;cursor:not-allowed}

/* ─── Content ─── */
.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}
.warn{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.3);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:#fbbf24;line-height:1.5}

.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}

.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}
.charts-2x3{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}

.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

.sw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.sp{width:32px;height:32px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{color:var(--hint);font-size:13px}
canvas{display:block}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.85;cursor:pointer;filter:invert(1)}

/* ─── Mobile ─── */
@media(max-width:768px){
  .app-hdr{height:auto;flex-wrap:wrap;padding:0;gap:0;align-items:stretch}
  .funil-wrap{padding:9px 14px;flex-shrink:0;border-bottom:1px solid var(--border)}
  .hdr-right{order:2;flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 14px 8px 8px;flex-wrap:nowrap;border-bottom:1px solid var(--border)}
  .hdr-right::-webkit-scrollbar{display:none}
  .presets{flex-wrap:nowrap;gap:3px}
  .btn-pre{font-size:10px;padding:4px 8px;flex-shrink:0}
  .drbox{flex-shrink:0}
  .drbox input[type=date]{width:86px;font-size:10px}
  .btn-update{font-size:11px;padding:5px 10px;flex-shrink:0}
  .hdr-tabs{order:3;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap;gap:2px;padding:6px 14px 8px}
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  [style*="repeat(3,1fr)"],[style*="repeat(4,1fr)"],[style*="repeat(5,1fr)"],
  [style*="repeat(6,1fr)"],[style*="repeat(7,1fr)"],[style*="repeat(8,1fr)"]{grid-template-columns:repeat(2,1fr)!important;gap:8px!important}
  [style*="1fr 420px"]{grid-template-columns:1fr!important}
  [style*="210px 1fr"]{grid-template-columns:1fr!important}
  .charts-2x3{grid-template-columns:1fr!important;gap:10px!important}
  .page table{font-size:10px!important}
  .page td,.page th{padding:7px 8px!important;white-space:nowrap}
  .page td:first-child,.page th:first-child{white-space:normal;min-width:90px;max-width:140px}
  .section-lbl{margin-top:16px}
}
</style>
</head>
<body>
<header class="app-hdr">
  <div class="funil-wrap">
    <div class="funil-btn">
      <span class="funil-dot"></span>
      <div>
        <div class="funil-name">Elton - Seguidores</div>
        <div class="funil-status">ativo</div>
      </div>
    </div>
  </div>
  <nav class="hdr-tabs" id="hdr-tabs"></nav>
  <div class="hdr-right">
    <div class="presets" id="hdr-presets"></div>
    <div class="drbox">
      <span class="drbox-icon" title="Abrir calendário (início)" onclick="openPicker('hdr-start')" style="cursor:pointer">📅</span>
      <input type="date" id="hdr-start" onchange="onDCCurrent('s',this.value)" onclick="this.showPicker&&this.showPicker()"/>
      <span class="drbox-sep">→</span>
      <input type="date" id="hdr-end" onchange="onDCCurrent('e',this.value)" onclick="this.showPicker&&this.showPicker()"/>
      <span class="drbox-icon" title="Abrir calendário (fim)" onclick="openPicker('hdr-end')" style="cursor:pointer">📅</span>
    </div>
    <button class="btn-update" id="btn-update" onclick="loadData(true)">↻ Atualizar</button>
    <span id="src-badge" title="Fonte de dados"></span>
  </div>
</header>

<div class="app-content">
  <div class="sw" id="loading"><div class="sp"></div><p class="st">Carregando dados...</p></div>
  <div id="err-panel" style="display:none;align-items:flex-start;justify-content:center;padding:40px 24px"></div>
  <div id="page-principal"    class="page active"></div>
  <div id="page-trafego"      class="page"></div>
  <div id="page-anuncios"     class="page"></div>
  <div id="page-resumo"       class="page"></div>
  <div id="page-planejamento" class="page"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
//  Elton - Seguidores  ·  modelo replicado do funil "TMB - Seguidores"
//  Fonte: planilha própria do Elton, aba "Base Seguidores Elton"
// ═══════════════════════════════════════════════════════════════════════════
const SHEET_CFG={
  id:"16qNO3FVA-cUI2WwK_UBkWhwx8MQUhi_lgSB-307_jY0",
  tab:"Base Seguidores Elton",
  refreshMin:60,
};
const FUNIL_NOME   = "Elton - Seguidores";
const RESUMO_TITULO= "Elton - Distribuição";
const ADS_TITULO   = "Melhores ads - Elton Seguidores";

// ── Metas (VAZIAS por enquanto) ───────────────────────────────────────────
// Para ativar uma meta, descomente/preencha a linha: o dash passa a mostrar
// o emoji 🟢🟡🔴 e o "Meta: ..." no Resumo diário automaticamente.
const METAS_SEG = {
  // custoVisita: {val:0.48,  higher:false},
  // custoSeg:    {val:14.84, higher:false},
  // txConvSeg:   {val:3.27,  higher:true},
  // hookRate:    {val:2.39,  higher:true},
  // holdRate:    {val:18.64, higher:true},
  // cpc:         {val:0.46,  higher:false},
  // ctr:         {val:1.26,  higher:true},
  // cpm:         {val:5.85,  higher:false},
};

// Nomes de coluna aceitos (mesmo padrão da "Base seguidores" da TMB)
const COLS={
  camp:   ["Nome da campanha"],
  ad:     ["Nome do anúncio"],
  adId:   ["Identificação do anúncio","ID do anúncio"],
  dia:    ["Dia"],
  spend:  ["Valor usado (BRL)","Valor gasto (BRL)"],
  clicks: ["Cliques no link"],
  impr:   ["Impressões"],
  pv:     ["Visitas ao perfil do Instagram"],
  alcance:["Alcance"],
  seg:    ["Seguidores no Instagram"],
  v3:     ["Reproduções do vídeo por no mínimo 3 segundos","Reproduções de vídeo de 3 segundos"],
  v25:    ["Reproduções de 25% do vídeo"],
};

const CHART_COLOR="#3b82f6", CHART_INV="#3b82f6", CHART_CPL="#fbbf24";

// ── State ─────────────────────────────────────────────────────────────────
const S={
  distMeta:{}, distMetaByAd:{}, distMetaByAdByDate:{}, distMetaByCamp:{}, distMetaByCampByDate:{},
  distSeg:{}, distSegByAd:{}, distSegByCamp:{},
  cols:{clicks:true,v3:true,v25:true},
  manualSpendHoje:null, manualPlanDist:null,
  startDate:"", endDate:"", activeQuick:"30d",
  aSort:{col:"spend",dir:"desc"}, cSort:{col:"spend",dir:"desc"},
  campSearch:"", adSearch:"",
  selectedCamps:new Set(), selectedAds:new Set(),
  currentPage:"principal",
  updated:null, loading:true, error:null, firstLoad:true,
};

// ── Datas (GMT-3) ─────────────────────────────────────────────────────────
function nowBR(){ return new Date(Date.now()-(3*60*60*1000)); }
function toISODate(d){ return d.toISOString().split("T")[0]; }
function todayISO(){ return toISODate(nowBR()); }
function yesterdayISO(){ const d=nowBR();d.setDate(d.getDate()-1);return toISODate(d); }
function nDaysAgoISO(n){ const d=nowBR();d.setDate(d.getDate()-n);return toISODate(d); }
function firstOfMonthISO(){ const d=nowBR();return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-01`; }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return toISODate(d); }
function subDays(iso,n){ return addDays(iso,-n); }

// ── Formatação ────────────────────────────────────────────────────────────
function parseBRL(s){
  if(!s||s==="-"||s==="0")return 0;
  s=String(s).replace(/[R$\s]/g,"").trim();
  if(!s||s==="-")return 0;
  if(s.includes(",")&&s.includes("."))return parseFloat(s.replace(/\./g,"").replace(",","."))||0;
  if(s.includes(","))return parseFloat(s.replace(",","."))||0;
  return parseFloat(s)||0;
}
function parseCount(v){
  let s=String(v==null?"":v).trim();
  if(!s)return 0;
  if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");          // 1.234 → 1234
  else s=s.replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".");
  const n=Math.round(parseFloat(s));
  return isFinite(n)?n:0;
}
function fBRL(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fBRLShort(n){ const a=Math.abs(n||0),sg=n<0?"-":"";if(a>=1000)return sg+"R$ "+(a/1000).toFixed(1).replace(".",",")+"k";return sg+"R$ "+Math.round(a); }
function fPct(n){ return (n||0).toFixed(1)+"%"; }
function fDate(iso){ if(!iso)return"";const[,m,d]=iso.split("-");return `${d}/${m}`; }
function fDateBR(iso){ if(!iso)return"";const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`; }
function toISO(s){
  if(!s)return null;
  s=String(s).trim().split(" ")[0];
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const p=s.split("/");
  if(p.length===3){
    const y=p[2].length===4?p[2]:"20"+p[2];
    const b=parseInt(p[1]);
    if(b>12)return `${y}-${p[0].padStart(2,"0")}-${p[1].padStart(2,"0")}`;
    return `${y}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;
  }
  return null;
}
const _normName=s=>(s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

// Métrica indisponível (coluna bruta ausente na aba) → mostra "—"
function naKey(k){
  if((k==="cpc"||k==="ctr")&&!S.cols.clicks)return true;
  if(k==="hookRate"&&!S.cols.v3)return true;
  if(k==="holdRate"&&(!S.cols.v3||!S.cols.v25))return true;
  return false;
}
function fmtM(k,v,fmt){ return naKey(k)?"—":fmt(v); }

// ── CSV / Sheets ──────────────────────────────────────────────────────────
function parseCSVText(text){
  const lines=text.split(/\r?\n/);
  const result=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const row=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){row.push(cur);cur="";}
      else cur+=c;
    }
    row.push(cur);
    result.push(row);
  }
  return {values:result};
}
function parseSheet(json){
  const rows=json.values||[];if(rows.length<2)return[];
  const h=rows[0].map(x=>String(x||"").trim());
  return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));
}
async function fetchSheet(tabName,sheetId){
  const url=`https://docs.google.com/spreadsheets/d/${sheetId||SHEET_CFG.id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tabName)}&_=${Date.now()}`;
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),40000);
  let res;
  try{ res=await fetch(url,{cache:"no-cache",signal:ctrl.signal}); }
  catch(e){ clearTimeout(timer); throw new Error(`falha de rede na aba "${tabName}": ${e.message}`); }
  clearTimeout(timer);
  if(!res.ok) throw new Error(`erro ${res.status} na aba "${tabName}" (a planilha está pública?)`);
  const text=await res.text();
  if(!text||text.trim().length<10) throw new Error(`aba "${tabName}" veio vazia`);
  return parseCSVText(text);
}
function hasAny(rows,names){ return rows.length>0 && names.some(n=>Object.prototype.hasOwnProperty.call(rows[0],n)); }
function pick(r,names){ for(const n of names){ const v=r[n]; if(v!=null&&String(v).trim()!=="")return v; } return ""; }

// ── Base Seguidores Elton ─────────────────────────────────────────────────
function buildSeguidores(rows){
  const dMeta={}, dByAd={}, dByAdByDate={}, dByCamp={}, dByCampByDate={};
  const dSeg={}, dSegByAd={}, dSegByCamp={};
  S.cols={clicks:hasAny(rows,COLS.clicks), v3:hasAny(rows,COLS.v3), v25:hasAny(rows,COLS.v25)};
  let kept=0, skipped=0;
  for(const r of rows){
    const campName=(pick(r,COLS.camp)||"—").trim();
    if(!_normName(campName).includes("distribuic")){ skipped++; continue; }
    const d=toISO(pick(r,COLS.dia)); if(!d)continue;
    const sp=parseBRL(pick(r,COLS.spend));
    const cl=parseCount(pick(r,COLS.clicks));
    const im=parseCount(pick(r,COLS.impr));
    const pv=parseCount(pick(r,COLS.pv));
    const al=parseCount(pick(r,COLS.alcance));
    const seg=parseCount(pick(r,COLS.seg));
    const v3=parseCount(pick(r,COLS.v3));
    const v25=parseCount(pick(r,COLS.v25));
    const adName=String(pick(r,COLS.ad)).trim();
    const adId=String(pick(r,COLS.adId)).trim();
    let igUrl=""; for(const k in r){ const v=String(r[k]||"").trim(); if(/^https?:\/\//i.test(v)){igUrl=v;break;} }
    kept++;

    if(!dMeta[d])dMeta[d]={spend:0,clicks:0,impressions:0,profileVisits:0,video3s:0,video15s:0,alcance:0};
    dMeta[d].spend+=sp; dMeta[d].clicks+=cl; dMeta[d].impressions+=im;
    dMeta[d].profileVisits+=pv; dMeta[d].video3s+=v3; dMeta[d].video15s+=v25; dMeta[d].alcance+=al;
    if(!dSeg[d])dSeg[d]={seguidores:0,profileVisits:0};
    dSeg[d].seguidores+=seg; dSeg[d].profileVisits+=pv;

    if(adName){
      if(!dByAd[adName])dByAd[adName]={adName,adIds:new Set(),igUrl:"",camps:new Set()};
      if(adId)dByAd[adName].adIds.add(adId);
      if(igUrl&&!dByAd[adName].igUrl)dByAd[adName].igUrl=igUrl;
      if(campName!=="—")dByAd[adName].camps.add(campName);
      if(!dByAdByDate[adName])dByAdByDate[adName]={};
      // gasto do anúncio SEPARADO por campanha (filtro de campanha restringe os números)
      const key=campName;
      if(!dByAdByDate[adName][key])dByAdByDate[adName][key]={};
      const t=dByAdByDate[adName][key];
      if(!t[d])t[d]={spend:0,clicks:0,impressions:0,profileVisits:0,seguidores:0};
      t[d].spend+=sp; t[d].clicks+=cl; t[d].impressions+=im; t[d].profileVisits+=pv; t[d].seguidores+=seg;
    }
    if(campName!=="—"){
      if(!dByCampByDate[campName])dByCampByDate[campName]={};
      if(!dByCampByDate[campName][d])dByCampByDate[campName][d]={spend:0,clicks:0,impressions:0,profileVisits:0,seguidores:0};
      const c=dByCampByDate[campName][d];
      c.spend+=sp; c.clicks+=cl; c.impressions+=im; c.profileVisits+=pv; c.seguidores+=seg;
    }
  }
  S.distMeta=dMeta; S.distMetaByAd=dByAd; S.distMetaByAdByDate=dByAdByDate;
  S.distMetaByCampByDate=dByCampByDate; S.distSeg=dSeg;

}

async function loadData(){
  S.loading=true; S.error=null; render();
  try{
    const rows=parseSheet(await fetchSheet(SHEET_CFG.tab));
    if(!hasAny(rows,COLS.camp)) throw new Error(`aba "${SHEET_CFG.tab}" sem a coluna 'Nome da campanha' — confira o nome da aba`);
    if(!hasAny(rows,COLS.spend)) throw new Error(`aba "${SHEET_CFG.tab}" sem 'Valor gasto (BRL)' / 'Valor usado (BRL)'`);
    buildSeguidores(rows);

  render();
}

function derive(m){
  const pv=m.profileVisits||0, seg=m.seguidores||0;
  return {...m,
    hookRate:m.impressions>0?(m.video3s/m.impressions)*100:0,
    holdRate:m.video3s>0?(m.video15s/m.video3s)*100:0,
    cpc:m.clicks>0?m.spend/m.clicks:0,
    ctr:m.impressions>0?(m.clicks/m.impressions)*100:0,
    cpm:m.impressions>0?(m.spend/m.impressions)*1000:0,
    custoPorVisita:pv>0?m.spend/pv:0,
    custoPorSeguidor:seg>0?m.spend/seg:0,
    txConvSeg:pv>0?(seg/pv)*100:0};
}
function dayRaw(date){
  const m=S.distMeta[date]||{spend:0,clicks:0,impressions:0,profileVisits:0,video3s:0,video15s:0,alcance:0};
  const sg=S.distSeg[date]||{seguidores:0};
  return {spend:m.spend,clicks:m.clicks,impressions:m.impressions,alcance:m.alcance||0,
    profileVisits:m.profileVisits,video3s:m.video3s,video15s:m.video15s,seguidores:sg.seguidores||0};
}
function getDailyDist(start,end){
  return Object.keys(S.distMeta).sort().filter(d=>d>=start&&d<=end).map(date=>({date,label:fDate(date),...derive(dayRaw(date))}));
}
function getTotalsDist(daily){
  const t=daily.reduce((a,d)=>({
    spend:a.spend+d.spend,clicks:a.clicks+d.clicks,impressions:a.impressions+d.impressions,
    alcance:a.alcance+(d.alcance||0),profileVisits:a.profileVisits+d.profileVisits,
    video3s:a.video3s+d.video3s,video15s:a.video15s+d.video15s,seguidores:a.seguidores+d.seguidores,
  }),{spend:0,clicks:0,impressions:0,alcance:0,profileVisits:0,video3s:0,video15s:0,seguidores:0});
  return derive(t);
}
function getDayMetricsDist(iso){ return derive(dayRaw(iso)); }

// ── Gráficos (canvas) ─────────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)", TICK_C="#6b7689";
function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");if(!ctx)return null;ctx.scale(DPR,DPR);
  return ctx;
}
function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    ctx.lineTo(xP(n-1),yP(0));ctx.lineTo(xP(0),yP(0));ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,ctx.canvas.height/DPR);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}
function xLabels(ctx,data,xP,y){
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),y);});
  return step;
}
function drawDual(id,data,rKey,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:58,b:28,l:64};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0), rVals=data.map(d=>d[rKey]||0);
  const lMax=Math.max(...lVals,0.01)*1.15, rMax=Math.max(...rVals,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-(v/lMax)*cH, yPR=v=>P.t+cH-(v/rMax)*cH;
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("R$"+(rMax-(i/4)*rMax).toFixed(2).replace(".",","),P.l+cW+5,y+3.5);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPL,false);
  xLabels(ctx,data,xP,P.t+cH+18);
}
function drawCountBar(id,data,key,color,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:44};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  vals.forEach((v,i)=>{ const y=yP(v); ctx.fillStyle=color+"cc"; ctx.fillRect(xP(i)-barW/2,y,barW,Math.max(P.t+cH-y,1)); });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{ if(v>0&&(n<=30||i%step===0)){ ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;ctx.fillText(v,xP(i),yP(v)-4);} });
  xLabels(ctx,data,xP,P.t+cH+18);
}
function drawLineChart(id,data,key,fmtY,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:12,r:12,b:26,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>+(d[key])||0);
  const lMax=Math.max(...vals,0.01)*1.2;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/lMax)*cH;
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmtY(lMax-(i/4)*lMax),P.l-4,y+3);
  }
  drawLineArea(ctx,xP,yP,vals,CHART_COLOR,true);
  xLabels(ctx,data,xP,P.t+cH+18);
}
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL, cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{ h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fBRL)(+(d[l.key])||0)}</span></div>`; });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

    const sW=(document.getElementById("tcs-"+CHART_CFGS[0].key)?.parentElement?.offsetWidth)||500;
    CHART_CFGS.forEach(c=>{
      drawLineChart(`tcs-${c.key}`,daily,c.key,c.fmt,sW,170);
      setupTip(`tcs-${c.key}`,`tts-${c.key}`,daily,[{key:c.key,color:CHART_COLOR,name:c.lbl,fmt:c.fmt}],52,12);
    });
  });
}

// ── Campanhas / Anúncios ──────────────────────────────────────────────────
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const start=S.startDate,end=S.endDate;
  const fDM=iso=>{if(!iso)return"—";const[,m,d]=iso.split("-");return`${d}/${m}`;};
  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;
  const mk=(name,a)=>({...a,
    ctr:a.impressions>0?(a.clicks/a.impressions)*100:0, cpm:a.impressions>0?(a.spend/a.impressions)*1000:0,
    cpc:a.clicks>0?a.spend/a.clicks:0,
    custoPorVisita:a.profileVisits>0?a.spend/a.profileVisits:0, custoPorSeg:a.seguidores>0?a.spend/a.seguidores:0});
  const add=(a,v)=>{a.spend+=v.spend;a.clicks+=v.clicks;a.impressions+=v.impressions;a.profileVisits+=v.profileVisits;a.seguidores+=v.seguidores;};
  const zero=()=>({spend:0,clicks:0,impressions:0,profileVisits:0,seguidores:0});

  const campRows=[];
  for(const[campName,byDate] of Object.entries(S.distMetaByCampByDate)){
    const a=zero();
    for(const[d,v] of Object.entries(byDate)){ if(d>=start&&d<=end)add(a,v); }
    if(a.spend===0)continue;
    campRows.push({campName,...mk(campName,a)});
  }
  const {col:cCol,dir:cDir}=S.cSort;
  const sorter=(col,dir)=>(x,y)=>{const av=x[col]??0,bv=y[col]??0;if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);return dir==="asc"?av-bv:bv-av;};
  const sortedCamps=[...campRows].sort(sorter(cCol,cDir));
  const _cq=S.campSearch.trim().toLowerCase();
  const filteredCamps=_cq?sortedCamps.filter(c=>c.campName.toLowerCase().includes(_cq)):sortedCamps;

  const hasCampSel=S.selectedCamps.size>0;
  const adRows=[];
  for(const[adName,meta] of Object.entries(S.distMetaByAd)){
    const byCamp=S.distMetaByAdByDate[adName]||{};
    const a=zero();
    for(const[cName,byDate] of Object.entries(byCamp)){
      if(hasCampSel&&!S.selectedCamps.has(cName))continue;
      for(const[d,v] of Object.entries(byDate)){ if(d>=start&&d<=end)add(a,v); }
    }
    if(a.spend===0)continue;
    adRows.push({adName,igUrl:meta.igUrl||"",...mk(adName,a)});
  }
  const tot=campRows.reduce((a,c)=>{add(a,c);return a;},zero());
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;
  const totCustoPorSeg=tot.seguidores>0?tot.spend/tot.seguidores:0;

  const _aq=S.adSearch.trim().toLowerCase();
  const filteredAds=_aq?adRows.filter(a=>a.adName.toLowerCase().includes(_aq)):adRows;
  const {col,dir}=S.aSort;
  const sorted=[...filteredAds].sort(sorter(col,dir));

  const selAds=sorted.filter(a=>S.selectedAds.has(a.adName));
  let adResumoText="";
  if(selAds.length){
    const L=[`*${ADS_TITULO}*`,"",`_${dateLabel}_`,""];
    for(const a of selAds){
      L.push("Nome do ad ⤵️");L.push(a.adName);
      if(a.igUrl)L.push(a.igUrl);
      L.push(`Investimento:\t${fBRL(a.spend)}`);
      L.push(`Visitas ao Perfil:\t${a.profileVisits}`);
      L.push(`Custo/Visita:\t${a.profileVisits>0?fBRL(a.custoPorVisita):"—"}`);
      L.push(`Seguidores:\t${a.seguidores}`);
      L.push(`Custo/Seguidor:\t${a.seguidores>0?fBRL(a.custoPorSeg):"—"}`);
      L.push("");
      L.push(`CTR:\t${fmtM("ctr",a.ctr,fPct)}`);
      L.push(`CPM:\t${fBRL(a.cpm)}`);
      L.push("");
    }
    adResumoText=L.join("\n");
  }
  el._adResumoText=adResumoText;

  const _fid=document.activeElement?.id;
  const TH="padding:10px 14px;text-align:right;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap";
  const THL="padding:10px 14px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none";
  const THCK="width:36px;padding:10px 8px;text-align:center;border-bottom:1px solid var(--border)";
  const TD="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong)";
  const thS=(c,lbl,isCamp)=>{
    const aC=isCamp?cCol:col,aD=isCamp?cDir:dir,active=aC===c;
    const arrow=active?(aD==="asc"?" ↑":" ↓"):" ↕";
    return `<th onclick="${isCamp?"sortCampanhas":"sortAnuncios"}('${c}')" style="${TH};color:${active?"var(--text)":"var(--hint)"}">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};font-size:9px;margin-left:3px">${arrow}</span></th>`;
  };
  const chkBox=ch=>`<div style="width:16px;height:16px;border-radius:4px;border:2px solid ${ch?"#10b981":"rgba(255,255,255,.2)"};background:${ch?"#10b981":"transparent"};display:flex;align-items:center;justify-content:center;margin:auto">${ch?`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L4 7L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}</div>`;
  const metricCells=x=>`
    <td style="${TD}">${fBRL(x.spend)}</td>
    <td style="${TD}">${x.profileVisits}</td>
    <td style="${TD}">${x.custoPorVisita>0?fBRL(x.custoPorVisita):"—"}</td>
    <td style="${TD}">${x.seguidores}</td>
    <td style="${TD}">${x.custoPorSeg>0?fBRL(x.custoPorSeg):"—"}</td>
    <td style="${TD}">${fmtM("ctr",x.ctr,fPct)}</td>
    <td style="${TD}">${fBRL(x.cpm)}</td>`;
  const metricHeads=isCamp=>`${thS("spend","Investimento",isCamp)}${thS("profileVisits","Visitas",isCamp)}${thS("custoPorVisita","Custo/Visita",isCamp)}${thS("seguidores","Seguidores",isCamp)}${thS("custoPorSeg","Custo/Seg.",isCamp)}${thS("ctr","CTR",isCamp)}${thS("cpm","CPM",isCamp)}`;
  const rowStyle=sel=>`cursor:pointer;border-top:1px solid var(--border);background:${sel?"rgba(16,185,129,.1)":"transparent"}`;
  const searchBox=(id,fn,val,ph)=>`<div style="position:relative;margin-bottom:10px">
      <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:12px;pointer-events:none">🔍</span>
      <input id="${id}" oninput="${fn}(this.value)" value="${esc(val)}" placeholder="${ph}" style="width:100%;padding:8px 12px 8px 34px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none"/>
    </div>`;
  const clearBtn=(fn,n)=>n>0?`<button onclick="${fn}()" style="font-size:10px;padding:3px 9px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#f87171;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">✕ Limpar (${n})</button>`:"";

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div><div class="hdr-title">Campanhas / Anúncios — ${FUNIL_NOME}</div>
        <div class="hdr-sub">atualizado em: ${S.updated||"—"} · ${sortedCamps.length} campanhas · ${sorted.length} anúncios${S.selectedAds.size>0?" · "+S.selectedAds.size+" selecionado(s)":""}</div></div>
    </div>
    ${errHTML()}
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:20px">
      ${kpiCard("Investimento",fBRL(tot.spend))}
      ${kpiCard("Visitas ao Perfil",tot.profileVisits.toLocaleString("pt-BR"))}
      ${kpiCard("Seguidores",tot.seguidores.toLocaleString("pt-BR"))}
      ${kpiCard("Custo/Seguidor",totCustoPorSeg>0?fBRL(totCustoPorSeg):"—")}
      ${kpiCard("CTR",fmtM("ctr",totCtr,fPct))}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin:0">Campanhas</div>${clearBtn("clearCamps",S.selectedCamps.size)}
      <span style="font-size:10px;color:var(--hint)">Clique para filtrar anúncios</span>
    </div>
    ${searchBox("camp-search-input","setCampSearch",S.campSearch,"Buscar campanha…")}
    <div style="overflow-x:auto;margin-bottom:22px">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:var(--card)"><th style="${THCK}"></th>
          <th onclick="sortCampanhas('campName')" style="${THL}">Campanha ${cCol==="campName"?(cDir==="asc"?"↑":"↓"):"↕"}</th>${metricHeads(true)}</tr></thead>
        <tbody>${filteredCamps.map(c=>{const sel=S.selectedCamps.has(c.campName);return `<tr onclick="toggleCamp('${jsq(c.campName)}')" style="${rowStyle(sel)}">
          <td style="padding:8px;text-align:center">${chkBox(sel)}</td>
          <td style="padding:9px 14px;color:${sel?"#10b981":"var(--text)"};font-size:11px;font-weight:${sel?600:400};max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(c.campName)}">${esc(c.campName)}</td>
          ${metricCells(c)}</tr>`;}).join("")}</tbody>
      </table>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin:0">Anúncios</div>${clearBtn("clearAds",S.selectedAds.size)}
      <span style="font-size:10px;color:var(--hint)">Clique para selecionar e gerar resumo</span>
    </div>
    ${searchBox("ad-search-input","setAdSearch",S.adSearch,"Buscar anúncio…")}
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:var(--card)"><th style="${THCK}"></th>
          <th onclick="sortAnuncios('adName')" style="${THL}">Anúncio ${col==="adName"?(dir==="asc"?"↑":"↓"):"↕"}</th>${metricHeads(false)}
          <th style="padding:10px 14px;text-align:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);border-bottom:1px solid var(--border);white-space:nowrap">Ver Anúncio</th></tr></thead>
        <tbody>${sorted.map(a=>{const sel=S.selectedAds.has(a.adName);return `<tr onclick="toggleAd('${jsq(a.adName)}')" style="${rowStyle(sel)}">
          <td style="padding:8px;text-align:center">${chkBox(sel)}</td>
          <td style="padding:9px 14px;color:${sel?"#10b981":"var(--text)"};font-size:11px;font-weight:${sel?600:400};max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(a.adName)}">${esc(a.adName)}</td>
          ${metricCells(a)}
          <td style="padding:9px 14px;text-align:center" onclick="event.stopPropagation()">${a.igUrl?`<a href="${esc(a.igUrl)}" target="_blank" rel="noopener" style="display:inline-block;padding:3px 8px;border:1px solid rgba(99,179,237,.35);border-radius:5px;color:#63b3ed;text-decoration:none;font-size:10px;font-weight:600">Ver ↗</a>`:"—"}</td></tr>`;}).join("")}</tbody>
      </table>
    </div>
    ${selAds.length?`
    <div style="margin-top:22px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div><div class="section-lbl" style="margin:0 0 2px">Resumo de Anúncios</div><div style="font-size:10px;color:var(--hint)">${selAds.length} ad(s): ${dateLabel}</div></div>
        <button id="btn-copy-ads" onclick="copyAdResumo()" style="padding:6px 16px;background:rgba(59,130,246,.15);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;font-family:'DM Sans',sans-serif">📋 Copiar resumo</button>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px">
        <pre style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.9;margin:0;user-select:all">${esc(adResumoText)}</pre>
      </div>
    </div>`:""}`;
  if(_fid==="camp-search-input"||_fid==="ad-search-input"){
    requestAnimationFrame(()=>{ const i=document.getElementById(_fid); if(i){i.focus();const l=i.value.length;i.setSelectionRange(l,l);} });

}

// ── Resumo diário ─────────────────────────────────────────────────────────
function renderResumo(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const today=todayISO(),yest=yesterdayISO();
  const start=S.startDate||today,end=S.endDate||today;
  const per=(s,e)=>getTotalsDist(getDailyDist(s,e));
  const tot=per(start,end), ontem=per(yest,yest), hojeBase=per(today,today);
  const manSeg=S.manualSpendHoje;
  const hoje=manSeg!=null?derive({...hojeBase,spend:manSeg}):hojeBase;

  const fDM=iso=>{if(!iso)return"—";const[,m,d]=iso.split("-");return`${d}/${m}`;};
  const dateLabel=start===end?fDM(start):`${fDM(start)} a ${fDM(end)}`;
  const fIntR=n=>(n||0).toLocaleString("pt-BR");
  const fP=n=>((n||0).toFixed(2)).replace(".",",")+"%";
  const M=METAS_SEG;
  // Meta: só aparece se estiver preenchida em METAS_SEG (hoje está vazia)
  function metaInfo(key,val,isMoney){
    const m=M[key]; if(!m)return {emoji:"",txt:""};
    let emoji="";
    if(val){ const ratio=m.higher?val/m.val:m.val/val; emoji=ratio>=1?"🟢":(ratio>=0.85?"🟡":"🔴"); }
    const txt="Meta: "+(isMoney?"R$ "+m.val.toFixed(2).replace(".",","):m.val.toFixed(2).replace(".",",")+"%");
    return {emoji,txt};
  }
  const v=(key,val,fmt)=>naKey(key)?"—":fmt(val);

  // [rótulo, chave, valor formatado, chave de meta, é R$, só no Total]
  function linhas(m,isTotal){
    const L=[];
    L.push({lbl:"Investimento",val:fBRL(m.spend)});
    if(isTotal)L.push({lbl:"Alcance",val:m.alcance>0?fIntR(m.alcance):"—"});
    L.push({lbl:"Visitas ao Perfil",val:fIntR(m.profileVisits)});
    L.push({lbl:"Custo por visita ao perfil",val:m.custoPorVisita>0?fBRL(m.custoPorVisita):"—",mk:"custoVisita",raw:m.custoPorVisita,money:true});
    L.push({lbl:"Seguidores",val:fIntR(m.seguidores)});
    L.push({lbl:"Custo por Seguidor",val:m.custoPorSeguidor>0?fBRL(m.custoPorSeguidor):"—",mk:"custoSeg",raw:m.custoPorSeguidor,money:true});
    if(isTotal){L.push({gap:true});L.push({lbl:"Tx de conversão de seguidores",val:fP(m.txConvSeg),mk:"txConvSeg",raw:m.txConvSeg});}
    L.push({gap:true});
    L.push({lbl:"hook rate (viu 3s / impressões)",val:v("hookRate",m.hookRate,fP),mk:"hookRate",raw:m.hookRate});
    L.push({lbl:"hold rate (viu 15s / viu 3s)",val:v("holdRate",m.holdRate,fP),mk:"holdRate",raw:m.holdRate});
    L.push({lbl:"CPC",val:v("cpc",m.cpc,fBRL),mk:"cpc",raw:m.cpc,money:true});
    L.push({lbl:"CTR",val:v("ctr",m.ctr,fP),mk:"ctr",raw:m.ctr});
    L.push({lbl:"CPM",val:fBRL(m.cpm),mk:"cpm",raw:m.cpm,money:true});
    return L;
  }
  function blockText(label,m,isTotal){
    const out=[`*${label}*`,""];
    for(const l of linhas(m,isTotal)){
      if(l.gap){out.push("");continue;}
      let line=`${l.lbl}:\t${l.val}`;
      if(l.lbl==="Investimento"&&isTotal&&S.manualPlanDist!=null)line+=`\t(plan até hj: ${fBRL(S.manualPlanDist)} )`;
      if(l.mk){const mi=metaInfo(l.mk,l.raw,l.money); if(mi.txt)line+=`\t${mi.emoji} ${mi.txt}`;}
      out.push(line);
    }
    return out.join("\n");
  }
  const resumoText=
`*${RESUMO_TITULO}*

_${dateLabel}_

📶 ${blockText("Total",tot,true)}

⬅️ ${blockText("Ontem",ontem,false)}

⬇️ ${blockText("Hoje",hoje,false)}`;

  const GRID="display:grid;grid-template-columns:210px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center";
  const rowHTML=l=>{
    if(l.gap)return `<div style="height:10px"></div>`;
    const mi=l.mk?metaInfo(l.mk,l.raw,l.money):{emoji:"",txt:""};
    return `<div style="${GRID}"><span style="color:var(--muted);font-size:12px">${l.lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${l.val}</span>
      <span style="font-size:13px;text-align:right;white-space:nowrap">${mi.emoji}<span style="font-size:10px;color:var(--hint);margin-left:4px">${mi.txt}</span></span></div>`;
  };
  const inputRow=(lbl,id,val,ph,onIn,onClr,clrLbl)=>`<div style="${GRID}">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <input id="${id}" value="${val!=null?val.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):""}" placeholder="${ph}" oninput="${onIn}(this.value)" onkeydown="if(event.key==='Enter')this.blur()"
        style="font-family:'JetBrains Mono',monospace;font-size:12px;color:${val!=null?"#fbbf24":"var(--text-strong)"};background:transparent;border:none;border-bottom:1px solid ${val!=null?"rgba(251,191,36,.4)":"rgba(255,255,255,.1)"};outline:none;padding:2px 0;width:100%"/>
      <span style="min-width:80px;text-align:right">${val!=null?`<button onclick="${onClr}()" style="font-size:10px;padding:2px 8px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fbbf24;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">${clrLbl}</button>`:""}</span>
    </div>`;
  function section(label,m,kind){
    const isTotal=kind==="total", isHoje=kind==="hoje";
    const ls=linhas(m,isTotal);
    let html="";
    for(const l of ls){
      if(l.lbl==="Investimento"){
        html+=isHoje?inputRow("Investimento","manual-spend-input",manSeg,fBRL(hojeBase.spend),"setManualSpendHoje","clearManualSpend","↩ Restaurar"):rowHTML(l);
        if(isTotal)html+=inputRow("Plan até hj","manual-plan-dist-input",S.manualPlanDist,"Digitar plan…","setManualPlanDist","clearManualPlanDist","↩ Limpar");
      } else html+=rowHTML(l);
    }
    return `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">${label}</div>${html}</div>`;
  }
  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div><div class="hdr-title">Resumo diário — ${FUNIL_NOME}</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)}</div></div>
      <button onclick="copyResumo()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif">📋 Copiar resumo</button>
    </div>
    ${errHTML()}${colsWarnHTML()}
    <div style="display:grid;grid-template-columns:1fr 420px;gap:20px;align-items:start">
      <div>${section("📶 Total",tot,"total")}${section("⬅️ Ontem",ontem,"ontem")}${section("⬇️ Hoje",hoje,"hoje")}</div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;position:sticky;top:70px">
        <pre style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0;user-select:all">${esc(resumoText)}</pre>
      </div>
    </div>`;
  el._resumoText=resumoText;
  requestAnimationFrame(()=>{
    const fid=document.activeElement?.id;
    if(fid==="manual-spend-input"||fid==="manual-plan-dist-input"){const s=document.getElementById(fid);if(s){const l=s.value.length;s.setSelectionRange(l,l);}}
  });
}
function parseMoneyInput(v){ const n=parseFloat(String(v).replace(/[R$\s.]/g,"").replace(",",".")); return (isNaN(n)||n<=0)?null:n; }
function setManualSpendHoje(v){ S.manualSpendHoje=parseMoneyInput(v); renderResumo(); }
function clearManualSpend(){ S.manualSpendHoje=null; renderResumo(); }
function setManualPlanDist(v){ S.manualPlanDist=parseMoneyInput(v); renderResumo(); }
function clearManualPlanDist(){ S.manualPlanDist=null; renderResumo(); }

// ── Planejamento ──────────────────────────────────────────────────────────
// Investimento mensal fixo (editável), dividido em partes iguais pelos dias do mês;
// o saldo restante é redistribuído igualmente pelos dias que faltam.
const PLAN_DEFAULT = 7500;
const PLAN_LS_KEY  = "elton_seg_plan_v1";
function planMonth(){ return todayISO().slice(0,7); }
function planDaysInMonth(){ const [y,m]=planMonth().split("-").map(Number); return new Date(y,m,0).getDate(); }
function loadPlan(){
  try{ const n=parseFloat(localStorage.getItem(PLAN_LS_KEY)); return (isFinite(n)&&n>0)?n:PLAN_DEFAULT; }catch(e){ return PLAN_DEFAULT; }
}
function savePlan(v){
  try{ localStorage.setItem(PLAN_LS_KEY,String(v)); S.planSaveError=localStorage.getItem(PLAN_LS_KEY)!==String(v); }
  catch(e){ S.planSaveError=true; }
}
function setPlanTotal(v){ const n=parseMoneyInput(v); if(n){S.planTotal=n;savePlan(n);} renderPlanejamento(); }
function getPlanDaily(){
  const total=S.planTotal, nDias=planDaysInMonth(), mes=planMonth();
  const today=todayISO(), yest=yesterdayISO();
  const dates=[]; for(let d=1;d<=nDias;d++) dates.push(`${mes}-${String(d).padStart(2,"0")}`);
  const realOn=d=>((S.distMeta[d]&&S.distMeta[d].spend)||0);
  const base=total/nDias;
  let spentAteOntem=0; for(const d of dates){ if(d<=yest) spentAteOntem+=realOn(d); }
  const remain=dates.filter(d=>d>=today);
  const unitAdj=remain.length>0?(total-spentAteOntem)/remain.length:0;
  return dates.map(date=>{
    const isPast=date<today, isToday=date===today, isFuture=date>today;
    const hasReal=date<=today&&!!S.distMeta[date];
    return {date,label:fDate(date),planInv:isPast?base:unitAdj,basePlanInv:base,realInv:hasReal?realOn(date):null,isPast,isToday,isFuture};
  });
}
function renderPlanejamento(){
  const el=document.getElementById("page-planejamento");if(!el)return;
  const rows=getPlanDaily(); const today=todayISO();
  const t={realInvTot:0,realAteOntem:0,sugeridoHoje:0,temHoje:false};
  rows.forEach(d=>{ if(d.realInv!=null)t.realInvTot+=d.realInv; if(d.isToday){t.sugeridoHoje=d.planInv;t.temHoje=true;} if(d.date<today&&d.realInv!=null)t.realAteOntem+=d.realInv; });
  const saldo=S.planTotal-t.realInvTot, metaAteHoje=t.realAteOntem+t.sugeridoHoje;
  const PLTHL="padding:11px 16px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);border-bottom:1px solid var(--border);white-space:nowrap";
  const PLTHR=PLTHL.replace("text-align:left","text-align:right");
  const PLTDL="padding:9px 16px;text-align:left;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text);border-bottom:1px solid var(--border)";
  const PLTD=PLTDL.replace("text-align:left","text-align:right")+";white-space:nowrap";
  const body=rows.map(d=>{
    const tag=d.isToday?`<span style="color:#60a5fa;font-weight:700"> 👈 hoje</span>`:(d.isFuture?`<span style="color:var(--hint);font-size:9px"> · ajustado</span>`:`<span style="color:var(--hint);font-size:9px"> · realizado</span>`);
    return `<tr style="${d.isToday?"background:rgba(59,130,246,.10)":""}"><td style="${PLTDL}">${d.label}${tag}</td><td style="${PLTD}">${fBRL(d.planInv)}</td><td style="${PLTD};font-weight:600">${d.realInv==null?"—":fBRL(d.realInv)}</td></tr>`;
  }).join("");
  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div><div class="hdr-title">Planejamento — ${FUNIL_NOME}</div>
        <div class="hdr-sub">${rows.length} dias · investimento mensal fixo · ajuste diário adaptativo · atualizado em: ${S.updated||"—"}</div></div>
    </div>
    ${errHTML()}
    <div class="cc" style="padding:16px 18px;margin-bottom:16px">
      <div style="display:flex;flex-direction:column;gap:3px">
        <label style="font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.06em">Investimento do mês (R$)</label>
        <input value="${S.planTotal.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}" onchange="setPlanTotal(this.value)" onkeydown="if(event.key==='Enter')this.blur()"
          style="width:150px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-strong);background:var(--surf);border:1px solid var(--border);border-radius:7px;padding:6px 9px;outline:none"/>
      </div>
      <div style="font-size:10px;color:var(--hint);margin-top:10px;line-height:1.6">
        Valor único para o mês, dividido em partes iguais pelos dias. O investimento sugerido do dia se ajusta pelo saldo restante conforme o realizado. Edições ficam salvas <b>neste navegador</b>.
      </div>
      ${S.planSaveError?`<div style="font-size:11px;color:#f87171;margin-top:8px;font-weight:600">⚠️ Não consegui salvar essa edição neste navegador — ao recarregar, o valor volta para R$ ${PLAN_DEFAULT.toLocaleString("pt-BR")}.</div>`:""}
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-bottom:13px">
      ${kpiCard("Investimento Planejado (mês)",fBRL(S.planTotal),"total do mês")}
      ${kpiCard("Investimento Realizado (mês)",fBRL(t.realInvTot),`vs esperado até hoje ${fBRL(metaAteHoje)} (até ontem + sugerido hoje)`)}
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px">
      ${kpiCard("🎯 Investimento sugerido hoje",t.temHoje?fBRL(t.sugeridoHoje):"—","ajustado pelo realizado")}
      ${kpiCard("Saldo restante do mês",fBRL(saldo),"Total - investido até hoje")}
      ${kpiCard("Investido até ontem",fBRL(t.realAteOntem),"dia fechado")}
    </div>
    <div class="cc" style="padding:0;overflow:hidden"><div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr><th style="${PLTHL}">DATA</th><th style="${PLTHR}">INVESTIMENTO PLANEJADO</th><th style="${PLTHR}">INVESTIMENTO REALIZADO</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div></div>`;
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  renderHeader();
  const ld=document.getElementById("loading");
  if(S.firstLoad&&S.loading){if(ld)ld.style.display="flex";return;}
  if(ld)ld.style.display="none";
  const errEl=document.getElementById("err-panel");
  if(S.error&&!Object.keys(S.distMeta).length){
    errEl.style.display="flex";
    errEl.innerHTML=`<div style="background:#1e1014;border:1px solid #f87171;border-radius:12px;padding:24px 28px;max-width:700px;width:100%">
      <div style="color:#f87171;font-weight:700;font-size:15px;margin-bottom:12px">⚠️ Erro ao carregar dados</div>
      <code style="display:block;color:#fca5a5;font-size:12px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-all;line-height:1.6">${esc(S.error)}</code>
      <button onclick="loadData(true)" style="margin-top:16px;padding:8px 18px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">↻ Tentar novamente</button>
    </div>`;
    document.querySelectorAll(".page").forEach(p=>p.style.display="none");
    return;
  }
  errEl.style.display="none";
  document.querySelectorAll(".page").forEach(p=>p.style.display="");
  const p=S.currentPage;
  if(p==="principal")renderPrincipal();
  else if(p==="trafego")renderTrafego();
  else if(p==="anuncios")renderAnuncios();
  else if(p==="resumo")renderResumo();
  else if(p==="planejamento")renderPlanejamento();
}

// ── Init ──────────────────────────────────────────────────────────────────
S.startDate=nDaysAgoISO(30); S.endDate=yesterdayISO(); S.activeQuick="30d";
S.planTotal=loadPlan();
render();
loadData();
setInterval(()=>{ if(!S.loading) loadData(true); }, (SHEET_CFG.refreshMin||60)*60*1000);
</script>
</body>
</html>
